name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      commit:
        description: Immutable commit targeted by the release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - run: npm install --global npm@11.5.1
      - run: npm --version
      - name: Verify requested immutable tag and package identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          expected_tag="v$package_version"
          test "$RELEASE_TAG" = "$expected_tag"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$EXPECTED_COMMIT"
          if npm view "$package_name@$package_version" version gitHead --json; then
            echo "Refusing to publish an existing npm version" >&2
            exit 1
          fi
      - run: npm publish --access public
