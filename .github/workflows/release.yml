name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      commit:
        description: Immutable commit targeted by the release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm install --global npm@11.5.1
      - run: npm --version
      - name: Verify requested immutable tag and package identity
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          package_version=$(node -p 'require("./package.json").version')
          [[ "$package_version" != *-* ]]
          test "$RELEASE_TAG" = "v$package_version"
          source_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$tag_commit" = "$source_commit"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
              test "$REQUESTED_COMMIT" = "$source_commit"
              ;;
            release) ;;
            *) echo "Unsupported publication event" >&2; exit 1 ;;
          esac
          echo "EXPECTED_COMMIT=$source_commit" >> "$GITHUB_ENV"
          node --input-type=module -e '
            import fs from "node:fs";
            const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            if (!fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/).some(line => line.startsWith(`## ${version} - `))) {
              throw new Error("Missing finalized changelog entry");
            }
          '
      - name: Locked install and offline validation
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm pack --dry-run --json
          test -z "$(git status --porcelain)"
      - name: Reconcile registry identity and publish only if absent
        run: |
          set -euo pipefail
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          metadata_file=$(mktemp)
          error_file=$(mktemp)
          trap 'rm -f "$metadata_file" "$error_file"' EXIT
          # Return 0 for the same immutable identity, 2 for proven absence.
          # Network failures, malformed metadata, and mismatches fail closed.
          registry_identity() {
            local status=0
            npm view "$package_name@$package_version" version gitHead --json --fetch-retries=0 --fetch-timeout=15000 >"$metadata_file" 2>"$error_file" || status=$?
            if [ "$status" -eq 0 ]; then
              node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (value.version !== process.argv[2] || value.gitHead !== process.argv[3]) {
                  console.error("Existing npm version has a different or missing immutable identity");
                  process.exit(1);
                }
              ' "$metadata_file" "$package_version" "$EXPECTED_COMMIT" || return 1
              return 0
            fi
            if [ "$status" -eq 1 ] && node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.exit(value.error?.code === "E404" && value.error?.summary === `No match found for version ${process.argv[2]}` ? 0 : 1);
            ' "$metadata_file" "$package_version"; then
              return 2
            fi
            echo "Unable to verify npm release identity" >&2
            return 1
          }
          status=0
          registry_identity || status=$?
          case "$status" in
            0) echo "Matching version already published; verifying without republishing" ;;
            2)
              # A failed response may follow acceptance by npm. Stop on failure;
              # inspect registry identity separately before any manual retry.
              # A successful publish is not gated on registry propagation.
              npm publish --access public
              ;;
            *) exit 1 ;;
          esac
